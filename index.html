<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal | Find Your Dream Career</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <h1 style="font-size: 24px;">JobPortal</h1>
        </div>
        <div class="nav-auth-links">
            <button class="btn primary-btn" onclick="window.location.href='login.php'" style="width: auto; padding: 8px 20px;">Login</button>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2>Find Your Dream Job Today</h2>

            <button onclick="window.location.href='login.php'">Get Started <i class='bx bx-right-arrow-alt'></i></button>

    <section class="main-content" style="margin-left: 0; text-align: center;">
        <div class="stats-grid" style="max-width: 1200px; margin: 0 auto;">
            <div class="stat-card">

                    <p>Professors & Researchers</p>

            <div class="stat-card">

                    <p>Admin & Support Staff</p>
                </div>
            </div>
            <div class="stat-card">
                <i class='bx bxs-buildings' style="font-size: 40px; color: var(--primary);"></i>
                <div>
                    <h3>Top Institutes</h3>
                    <p>Leading universities</p>
                </div>
